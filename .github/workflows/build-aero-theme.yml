name: Build Aero Android Theme

on:
  push:
    branches: [ "main" ]
    paths:
      - "aero-android-theme-shizuku/**"
      - ".github/workflows/build-aero-theme.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: aero-android-theme-shizuku

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aero-android-theme-debug-apk
          path: aero-android-theme-shizuku/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
