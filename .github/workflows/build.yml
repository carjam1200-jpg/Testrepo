name: Build vmtest.exe

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build executable
        shell: pwsh
        run: |
          python -m pip install --upgrade pip pyinstaller
          python -m PyInstaller --onefile --windowed --name vmtest src/vm_manager.py

      - name: Upload vmtest.exe
        uses: actions/upload-artifact@v4
        with:
          name: vmtest-windows
          path: dist/vmtest.exe
