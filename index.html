<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ToDo List (LocalStorage)</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app" aria-labelledby="app-title">
    <h1 id="app-title">ToDo List</h1>

    <form id="todo-form" class="todo-form" aria-label="Add new todo">
      <input id="todo-input" class="todo-input" autocomplete="off" placeholder="What needs to be done?" />
      <button type="submit" class="btn add-btn">Add</button>
    </form>

    <section class="controls" aria-label="Controls">
      <div class="filters" role="tablist" aria-label="Filter todos">
        <button class="filter-btn active" data-filter="all" role="tab" aria-selected="true">All</button>
        <button class="filter-btn" data-filter="active" role="tab" aria-selected="false">Active</button>
        <button class="filter-btn" data-filter="completed" role="tab" aria-selected="false">Completed</button>
      </div>
      <div class="actions">
        <button id="clear-completed" class="btn">Clear completed</button>
      </div>
    </section>

    <ul id="todo-list" class="todo-list" aria-live="polite"></ul>

    <footer class="footer">
      <span id="count" class="count">0 items left</span>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
